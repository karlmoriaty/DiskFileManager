name: build-and-test

on:
  push:
    branches:
      - main
      - "refactor/**"
      - "feature/**"
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore DiskManager.sln

      - name: Build
        run: dotnet build DiskManager.sln -c Release --no-restore

      - name: Test
        run: dotnet test DiskManager.Tests/DiskManager.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"